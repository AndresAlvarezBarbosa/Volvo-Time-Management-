<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Labor Logs · Q1–Q2 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="viz.css" />

<!-- Vendored libs (work fully offline; no CDN dependency) -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>

<style>
  body { background: #f0eee9; margin: 0; overflow: hidden; }
  body[data-theme="dark"] { background: oklch(0.13 0.01 270); }

  /* Toast for ingest feedback */
  .tm-toast {
    position: fixed; top: 56px; right: 18px; z-index: 9999;
    font: 500 12px/1.4 -apple-system, system-ui, sans-serif;
    color: #2a2520; background: #fef4a8; border-radius: 6px;
    padding: 8px 12px; max-width: 320px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    opacity: 0; transform: translateY(-4px);
    transition: opacity .18s, transform .18s;
    pointer-events: none;
  }
  .tm-toast.show { opacity: 1; transform: none; }
  .tm-toast.err  { background: #f8d4cc; color: #5a1f10; }
</style>
</head>
<body>
<div id="root"></div>

<div class="tm-toast" id="tmToast"></div>

<script>
  (function () {
    window.tmToast = function (msg, isErr) {
      var el = document.getElementById('tmToast');
      el.textContent = msg;
      el.classList.toggle('err', !!isErr);
      el.classList.add('show');
      clearTimeout(window.__tmToastT);
      window.__tmToastT = setTimeout(function () { el.classList.remove('show'); }, 2400);
    };
  })();
</script>

<!-- App modules (compiled in-browser by Babel from local src) -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data-utils.jsx"></script>
<script type="text/babel" src="search-bar.jsx"></script>
<script type="text/babel" src="excel-ingest.jsx"></script>
<script type="text/babel" src="artboards/overview.jsx"></script>
<script type="text/babel" src="artboards/calendar.jsx"></script>
<script type="text/babel" src="artboards/matrix.jsx"></script>
<script type="text/babel" src="artboards/flow.jsx"></script>
<script type="text/babel" src="artboards/timeline.jsx"></script>
<script type="text/babel" src="artboards/deepdive.jsx"></script>
<script type="text/babel" src="artboards/log.jsx"></script>
<script type="text/babel" src="artboards/project.jsx"></script>
<script type="text/babel" src="artboards/billability.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "accentHue": 145,
  "density": "regular",
  "showGrid": true
}/*EDITMODE-END*/;

const VIEWS = [
  { section: 'Overview', items: [
    { id: 'kpi',  num: '01', label: 'Overview',   w: 1100, h: 680, Component: () => <ArtboardOverview /> },
    { id: 'cal',  num: '02', label: 'Calendar',   w: 1100, h: 1100, Component: () => <ArtboardCalendar /> },
  ]},
  { section: 'Cross-cuts', items: [
    { id: 'mtx',  num: '03', label: 'Matrix',     w: 1100, h: 1080, Component: () => <ArtboardMatrix /> },
    { id: 'flow', num: '04', label: 'Flow',        w: 1500, h: 760, fluid: true, Component: () => <ArtboardFlow /> },
  ]},
  { section: 'Motion + Drilldown', items: [
    { id: 'tl',   num: '05', label: 'Timeline',   w: 1100, h: 680, Component: () => <ArtboardTimeline /> },
    { id: 'dd',   num: '06', label: 'Deep Dive',  w: 1100, h: 680, Component: () => <ArtboardDeepDive /> },
  ]},
  { section: 'Data', items: [
    { id: 'log',  num: '07', label: 'Hours Log',  w: 1100, h: 680, Component: () => <ArtboardLog /> },
    { id: 'proj', num: '08', label: 'Project View', w: 1100, h: 680, Component: () => <ArtboardProject /> },
    { id: 'bill', num: '09', label: 'Billability',  w: 1100, h: 680, Component: () => <ArtboardBillability /> },
  ]},
];
const ALL_VIEWS = VIEWS.flatMap(s => s.items);

function ScaledView({ view }) {
  const containerRef = React.useRef(null);
  const [size, setSize] = React.useState({ w: 800, h: 600 });

  React.useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const ro = new ResizeObserver(entries => {
      const r = entries[0].contentRect;
      if (r.width > 0 && r.height > 0) setSize({ w: r.width, h: r.height });
    });
    ro.observe(el);
    setSize({ w: el.clientWidth, h: el.clientHeight });
    return () => ro.disconnect();
  }, []);

  // Fluid views fill the available area natively. The component is expected
  // to measure its own container and relayout — no fixed-canvas zoom.
  if (view.fluid) {
    return (
      <div ref={containerRef} className="app-main">
        <div className="app-main-inner" style={{
          width: '100%', height: '100%', left: 0, top: 0,
          position: 'absolute', overflow: 'auto',
        }}>
          <view.Component />
        </div>
      </div>
    );
  }

  const pad = 8;
  const availW = size.w - pad * 2;
  const availH = size.h - pad * 2;
  const scale = Math.min(availW / view.w, availH / view.h, 1.5);
  const scaledW = view.w * scale;
  const scaledH = view.h * scale;

  return (
    <div ref={containerRef} className="app-main">
      <div className="app-main-inner" style={{
        width: view.w,
        height: view.h,
        zoom: scale,
        left: (size.w - scaledW) / 2,
        top: (size.h - scaledH) / 2,
        overflow: 'auto',
      }}>
        <view.Component />
      </div>
    </div>
  );
}

function SidebarFooter() {
  const { selEmps, selProjs, clearAll } = useFilter();
  const { selBrands, clearBrands } = useBrand();
  const { selFuncs, clearFuncs } = useFunc();
  const { query, setQuery, setScope } = useSearch();
  const hasFilters = selBrands.length > 0 || selFuncs.length > 0
    || query.trim().length > 0 || selEmps.length > 0 || selProjs.length > 0;

  const handleClear = () => {
    setQuery('');
    setScope('all');
    clearBrands();
    clearFuncs();
    clearAll();
  };

  return (
    <div className="app-sidebar-footer">
      <button className={'sidebar-footer-clear' + (hasFilters ? ' active' : '')}
        disabled={!hasFilters} onClick={handleClear}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        Clear all filters
      </button>
    </div>
  );
}

function SidebarMultiSelect({ label, placeholder, items, selected, onAdd, onRemove }) {
  const [text, setText] = React.useState('');
  const [open, setOpen] = React.useState(false);
  const [focusIdx, setFocusIdx] = React.useState(0);
  const inputRef = React.useRef(null);

  const suggestions = React.useMemo(() => {
    const q = text.trim().toLowerCase();
    if (!q) return items.filter(it => !selected.includes(it)).slice(0, 8);
    return items.filter(it => !selected.includes(it) && it.toLowerCase().includes(q)).slice(0, 8);
  }, [items, text, selected]);

  React.useEffect(() => { setFocusIdx(0); }, [text]);

  const pick = (item) => {
    onAdd(item);
    setText('');
    setFocusIdx(0);
    inputRef.current?.focus();
  };

  const onKey = (e) => {
    if (e.key === 'Backspace' && !text && selected.length > 0) {
      onRemove(selected[selected.length - 1]);
      return;
    }
    if (!open || !suggestions.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setFocusIdx(i => Math.min(suggestions.length - 1, i + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setFocusIdx(i => Math.max(0, i - 1)); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(suggestions[focusIdx]); }
    else if (e.key === 'Escape') { setOpen(false); inputRef.current?.blur(); }
  };

  const showDropdown = open && suggestions.length > 0;

  return (
    <div className="sidebar-search-group">
      <div className="sidebar-label mono">{label}</div>
      {selected.length > 0 && (
        <div className="sidebar-tags">
          {selected.map(s => (
            <span key={s} className="sidebar-tag">
              <span className="sidebar-tag-text" title={s}>{s}</span>
              <button className="sidebar-tag-x" onClick={() => onRemove(s)}>×</button>
            </span>
          ))}
        </div>
      )}
      <div className="sidebar-search-field">
        <svg className="sidebar-search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <input ref={inputRef} className="sidebar-search-input" placeholder={selected.length ? 'Add more…' : placeholder}
          value={text}
          onChange={e => { setText(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onBlur={() => setTimeout(() => setOpen(false), 150)}
          onKeyDown={onKey} />
        {text && <button className="sidebar-search-x" onMouseDown={e => { e.preventDefault(); setText(''); }}>×</button>}
      </div>
      {showDropdown && (
        <div className="sidebar-ac-dropdown">
          {suggestions.map((s, i) => (
            <button key={s} className={'sidebar-ac-item' + (i === focusIdx ? ' on' : '')}
              onMouseDown={e => { e.preventDefault(); pick(s); }}
              onMouseEnter={() => setFocusIdx(i)}>
              {s}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function SidebarControls() {
  const { selBrands, allBrands, addBrand, removeBrand } = useBrand();
  const { selFuncs, allFuncs, addFunc, removeFunc } = useFunc();
  const { selEmps, selProjs, addEmp, removeEmp, addProj, removeProj } = useFilter();
  const data = React.useContext(DataCtx);

  const empNames = React.useMemo(() => {
    if (!data) return [];
    let names = data.employees.map(e => e.name);
    if (selProjs.length > 0) {
      const projSet = new Set(selProjs);
      const namesOnProjects = new Set(data.records.filter(r => projSet.has(r.project)).map(r => r.name));
      names = names.filter(n => namesOnProjects.has(n));
    }
    if (selBrands.length > 0) {
      const brandSet = new Set(selBrands);
      names = names.filter(n => { const e = data.empByName[n]; return e && brandSet.has(e.brand); });
    }
    return names.sort();
  }, [data, selProjs, selBrands]);

  const projNames = React.useMemo(() => {
    if (!data) return [];
    let projects = [...new Set(data.records.map(r => r.project))];
    if (selEmps.length > 0) {
      const empSet = new Set(selEmps);
      projects = [...new Set(data.records.filter(r => empSet.has(r.name)).map(r => r.project))];
    }
    if (selBrands.length > 0) {
      const brandSet = new Set(selBrands);
      projects = [...new Set(data.records.filter(r => brandSet.has(r.brand) && projects.includes(r.project)).map(r => r.project))];
    }
    return projects.sort();
  }, [data, selEmps, selBrands]);

  return (
    <div className="sidebar-controls">
      <button className="sidebar-btn sidebar-upload" onClick={() => window.tmUploadXlsx && window.tmUploadXlsx()}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Upload Excel
      </button>
      <SidebarMultiSelect label="EMPLOYEES" placeholder="Search by name…"
        items={empNames} selected={selEmps} onAdd={addEmp} onRemove={removeEmp} />
      <SidebarMultiSelect label="PROJECTS" placeholder="Search by project…"
        items={projNames} selected={selProjs} onAdd={addProj} onRemove={removeProj} />
      {allBrands.length > 1 && (() => {
        const brandColor = (b) => {
          const lc = b.toLowerCase();
          if (lc === 'mack') return 'oklch(0.25 0.0 0)';
          if (lc === 'vtna') return 'oklch(0.72 0.18 175)';
          return 'oklch(0.70 0.16 55)';
        };
        return (
          <div className="sidebar-brand">
            <div className="sidebar-label mono">BRAND</div>
            <div className="sidebar-pills">
              {allBrands.map(b => {
                const c = brandColor(b);
                const on = selBrands.includes(b);
                return (
                  <button key={b} className={'sidebar-pill brand-pill' + (on ? ' on' : '')}
                    style={on
                      ? { background: c, borderColor: c, color: '#fff' }
                      : { borderLeft: `3px solid ${c}` }
                    }
                    onClick={() => on ? removeBrand(b) : addBrand(b)}>{b}</button>
                );
              })}
            </div>
          </div>
        );
      })()}
      <SidebarMultiSelect label="FUNCTION" placeholder="Search by function…"
        items={allFuncs} selected={selFuncs} onAdd={addFunc} onRemove={removeFunc} />
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeId, setActiveId] = React.useState('kpi');
  const activeView = ALL_VIEWS.find(v => v.id === activeId) || ALL_VIEWS[0];

  React.useEffect(() => {
    document.body.dataset.theme = t.dark ? 'dark' : 'light';
    document.documentElement.style.setProperty('--accent', `oklch(0.65 0.13 ${t.accentHue})`);
  }, [t.dark, t.accentHue]);

  React.useEffect(() => {
    const padMap = { compact: '24px 28px', regular: '36px 40px', comfy: '48px 56px' };
    document.documentElement.style.setProperty('--ab-pad', padMap[t.density] || padMap.regular);
    const id = '__density_override';
    let el = document.getElementById(id);
    if (!el) { el = document.createElement('style'); el.id = id; document.head.appendChild(el); }
    el.textContent = `.ab-frame { padding: ${padMap[t.density] || padMap.regular} !important; }`;
  }, [t.density]);

  React.useEffect(() => {
    const onKey = (e) => {
      const idx = ALL_VIEWS.findIndex(v => v.id === activeId);
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        setActiveId(ALL_VIEWS[(idx + 1) % ALL_VIEWS.length].id);
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        setActiveId(ALL_VIEWS[(idx - 1 + ALL_VIEWS.length) % ALL_VIEWS.length].id);
      }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [activeId]);

  return (
    <DataProvider>
      <BrandProvider>
      <FuncProvider>
      <FilterProvider>
      <SearchProvider>
      <div className="app-shell">
        <nav className="app-sidebar">
          <div className="app-sidebar-head">Labor Logs</div>
          <SidebarControls />
          <div className="app-sidebar-scroll">
            {VIEWS.map(sec => (
              <div key={sec.section}>
                <div className="app-sidebar-section">{sec.section}</div>
                {sec.items.map(v => (
                  <button key={v.id}
                    className={'app-sidebar-item' + (v.id === activeId ? ' active' : '')}
                    onClick={() => setActiveId(v.id)}>
                    <span className="app-sidebar-num">{v.num}</span>
                    {v.label}
                  </button>
                ))}
              </div>
            ))}
          </div>
          <SidebarFooter />
        </nav>
        <ScaledView key={activeId} view={activeView} />
      </div>
      </SearchProvider>
      </FilterProvider>
      </FuncProvider>
      </BrandProvider>

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakToggle label="Dark mode" value={t.dark} onChange={v => setTweak('dark', v)} />
        <TweakSlider label="Accent hue" value={t.accentHue} min={0} max={360} step={5} unit="°"
                     onChange={v => setTweak('accentHue', v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
                    options={['compact','regular','comfy']}
                    onChange={v => setTweak('density', v)} />
      </TweaksPanel>
    </DataProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
